<!doctype html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ai School Dashboard</title>
<style>
  :root{
    --bg:#000;
    --panel:#090909;
    --line:#1c1c1c;
    --line-soft:#121212;
    --txt:#f5f5f5;
    --mut:#858585;
    --neon:#00e5ff;
    --grn:#00ffa3;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.4;
    background:
      radial-gradient(700px 220px at 15% -90px, rgba(0,229,255,.20), transparent 60%),
      radial-gradient(600px 200px at 88% -70px, rgba(0,255,163,.13), transparent 60%),
      var(--bg);
    min-height:100vh;padding-bottom:70px;
  }
  /* halka sa digital grid, upar se neeche fade */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(0,229,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,.05) 1px, transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:linear-gradient(#000, transparent 62%);mask-image:linear-gradient(#000, transparent 62%);
  }
  .wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 16px}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--neon);outline-offset:2px}
  svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ── top line ── */
  header{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:13px 0 10px}
  h1{
    margin:0;font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.14em;color:#fff;
    display:flex;align-items:center;gap:10px;text-shadow:0 0 14px rgba(0,229,255,.45);
  }
  h1::before{
    content:"";width:9px;height:9px;border-radius:50%;background:var(--neon);
    box-shadow:0 0 10px var(--neon),0 0 22px rgba(0,229,255,.7);
  }
  h1::after{content:"";width:9px;height:17px;background:var(--neon);margin-left:-4px;box-shadow:0 0 10px rgba(0,229,255,.8);animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .prog{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--grn);text-shadow:0 0 8px rgba(0,255,163,.5);letter-spacing:.05em;white-space:nowrap}
  .prog i{display:block;width:74px;height:5px;border-radius:5px;background:#141414;border:1px solid #1f1f1f;overflow:hidden}
  .prog i b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--grn));box-shadow:0 0 8px var(--grn);transition:width .3s}
  .search{
    flex:1 1 220px;max-width:400px;margin-left:auto;
    display:flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:0 12px;
    transition:box-shadow .15s,border-color .15s;
  }
  .search:focus-within{border-color:var(--neon);box-shadow:0 0 0 1px rgba(0,229,255,.4),0 0 18px rgba(0,229,255,.22)}
  .search span{color:var(--neon);font-family:var(--mono)}
  .search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:9px 2px;font-family:var(--mono);font-size:13px;color:var(--txt)}
  .search input::placeholder{color:#5a5a5a}
  .lucky{
    display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:9px;
    background:transparent;border:1px solid rgba(0,255,163,.45);color:var(--grn);
    font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;transition:box-shadow .15s,background .15s;
  }
  .lucky svg{width:17px;height:17px}
  .lucky:hover{background:rgba(0,255,163,.08);box-shadow:0 0 16px rgba(0,255,163,.35)}
  .lucky:active svg{transform:rotate(90deg)}

  /* ── shelves: icon wali tiles, sab ek nazar mein ── */
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .tile{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:8px 4px 9px;min-width:0;overflow:hidden;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--mut);
    transition:color .12s,border-color .12s,box-shadow .12s,transform .12s;
  }
  .tile svg{width:20px;height:20px;flex:none}
  .tile .lb{font-family:var(--mono);font-size:10px;letter-spacing:.07em;white-space:nowrap}
  .tile .n{position:absolute;top:4px;right:6px;font-family:var(--mono);font-size:9.5px;color:#5c5c5c}
  .tile .pb{position:absolute;left:0;bottom:0;height:2px;background:var(--grn);box-shadow:0 0 8px var(--grn);transition:width .3s}
  .tile:hover{color:var(--txt);border-color:#333;transform:translateY(-1px)}
  .tile[aria-pressed="true"]{
    color:var(--neon);border-color:var(--neon);background:rgba(0,229,255,.05);
    box-shadow:0 0 0 1px rgba(0,229,255,.35),0 0 18px rgba(0,229,255,.32),inset 0 -12px 18px -14px rgba(0,229,255,.9);
    text-shadow:0 0 8px rgba(0,229,255,.6);
  }
  .tile[aria-pressed="true"] svg{filter:drop-shadow(0 0 5px rgba(0,229,255,.9))}
  .tile[aria-pressed="true"] .n{color:var(--neon)}
  .tile.full{border-color:rgba(0,255,163,.5)}
  .tile.full .n{color:var(--grn);text-shadow:0 0 8px rgba(0,255,163,.7)}
  .tile .dotnew{position:absolute;top:6px;left:7px;width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon)}
  .top{
    position:fixed;z-index:4;right:14px;bottom:14px;width:40px;height:40px;border-radius:50%;
    background:rgba(0,0,0,.85);border:1px solid var(--neon);color:var(--neon);font-family:var(--mono);font-size:16px;
    box-shadow:0 0 16px rgba(0,229,255,.4);
  }
  .top[hidden]{display:none}
  .bar.on ~ .top{bottom:76px}
  .tiles.dim .tile{opacity:.5}
  .scan{height:1px;margin-top:10px;background:var(--line);position:relative;overflow:hidden}
  .scan::after{content:"";position:absolute;top:0;left:0;width:30%;height:100%;background:linear-gradient(90deg,transparent,var(--neon),transparent);animation:scan 5s linear infinite}
  @keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(434%)}}

  /* ── khuli hui shelf ki line: naam + filter ── */
  .info{display:flex;flex-wrap:wrap;align-items:center;gap:5px 12px;padding:8px 0 2px}
  .info h2{margin:0;font-size:14.5px;font-weight:600;color:#fff}
  .info .about{color:var(--mut);font-size:12.5px}
  .info .stat{font-family:var(--mono);font-size:10.5px;color:var(--grn);letter-spacing:.05em;white-space:nowrap}
  .filters{margin-left:auto;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .viewchip{margin-left:6px}
  .views,.kinds{display:flex;gap:4px;flex-wrap:wrap}
  .viewchip,.kchip{
    background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--mut);
    font-family:var(--mono);font-size:10px;letter-spacing:.05em;white-space:nowrap;
  }
  .viewchip:hover,.kchip:hover{color:var(--txt);border-color:#333}
  .viewchip[aria-pressed="true"]{color:var(--grn);border-color:rgba(0,255,163,.55);background:rgba(0,255,163,.08);box-shadow:0 0 10px rgba(0,255,163,.16)}
  .kchip[aria-pressed="true"]{color:#000;background:var(--neon);border-color:var(--neon);font-weight:700;box-shadow:0 0 12px rgba(0,229,255,.45)}

  /* ── UP NEXT: dashboard kholte hi agla kaam clear ho ── */
  .deck{
    display:flex;align-items:center;gap:10px;min-height:42px;margin:8px 0 1px;padding:6px 8px 6px 10px;
    border:1px solid rgba(0,255,163,.23);border-left:2px solid var(--grn);border-radius:9px;
    background:linear-gradient(90deg,rgba(0,255,163,.07),rgba(0,229,255,.025) 55%,transparent);
  }
  .deck .beacon{width:8px;height:8px;flex:none;border-radius:50%;background:var(--grn);box-shadow:0 0 10px var(--grn),0 0 20px rgba(0,255,163,.6);animation:pulse 1.8s ease-in-out infinite}
  .deck .copy{min-width:0;display:flex;align-items:baseline;gap:8px;flex:1;overflow:hidden}
  .deck .eyebrow{flex:none;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;color:var(--grn);white-space:nowrap}
  .deck .nextname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:#ececec}
  .deck .nextname b{color:var(--neon);font-family:var(--mono);font-size:10.5px;margin-right:5px}
  .deck .meter{font-family:var(--mono);font-size:10px;color:var(--mut);white-space:nowrap}
  .deck .continue{
    flex:none;text-decoration:none;border:1px solid var(--grn);border-radius:6px;padding:5px 8px;
    color:#000;background:var(--grn);font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;
    box-shadow:0 0 12px rgba(0,255,163,.25);transition:transform .12s,box-shadow .12s;
  }
  .deck .continue:hover{transform:translateY(-1px);box-shadow:0 0 18px rgba(0,255,163,.55)}
  .deck.complete{border-left-color:var(--neon);border-color:rgba(0,229,255,.25);background:rgba(0,229,255,.04)}
  .deck.complete .beacon{background:var(--neon);box-shadow:0 0 10px var(--neon),0 0 20px rgba(0,229,255,.6)}
  .deck.complete .eyebrow{color:var(--neon)}

  /* ── list: columns mein, tarteeb ke saath ── */
  .cols{columns:270px;column-gap:22px}
  .sec{
    break-after:avoid;break-inside:avoid;display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--grn);text-shadow:0 0 8px rgba(0,255,163,.4);padding:7px 6px 3px;
  }
  .sec .st{flex:none;color:#000;background:var(--grn);border-radius:4px;padding:1px 5px;font-weight:700;letter-spacing:.04em;text-shadow:none;box-shadow:0 0 10px rgba(0,255,163,.5)}
  button.sec{width:100%;background:none;border:0;text-align:left;border-radius:6px}
  button.sec:hover{background:rgba(0,255,163,.05)}
  .sec .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sec .st{display:inline-block;margin-right:8px}
  .sec .ln{flex:1;min-width:10px;height:1px;background:linear-gradient(90deg,rgba(0,255,163,.35),transparent)}
  .sec .ct{flex:none;font-size:9.5px;letter-spacing:.04em;color:var(--mut);text-shadow:none}
  .sec .ct.full{color:var(--grn);text-shadow:0 0 8px rgba(0,255,163,.5)}
  .sec .chev{flex:none;width:6px;height:6px;margin:0 4px 3px 2px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);opacity:.7;transition:transform .15s}
  .sec[aria-expanded="false"]{border-bottom:1px solid var(--line-soft);padding-bottom:7px}
  .sec[aria-expanded="false"] .chev{transform:rotate(-45deg);margin-bottom:0}
  .sec.sub{color:var(--mut);text-shadow:none;padding-left:20px}
  .sec.sub .ln{background:linear-gradient(90deg,#222,transparent)}
  mark{background:rgba(0,229,255,.22);color:#fff;border-radius:3px;padding:0 1px;box-shadow:0 0 8px rgba(0,229,255,.3)}
  .new{color:#000;background:var(--neon);border-radius:4px;padding:0 5px;font-weight:700;letter-spacing:.06em;box-shadow:0 0 10px rgba(0,229,255,.6)}
  .row{display:flex;align-items:center;gap:4px;break-inside:avoid;border-bottom:1px solid var(--line-soft)}
  .anim .row{animation:rowin .24s ease both;animation-delay:calc(var(--i) * 12ms)}
  @keyframes rowin{from{opacity:0;transform:translateY(5px)}}
  .row a{text-decoration:none}
  .go{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:4px 6px;min-height:38px;border-radius:8px;color:#ececec}
  .go:hover{background:rgba(0,229,255,.07);box-shadow:inset 2px 0 0 var(--neon);color:#fff}
  .num{
    flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:7px;
    border:1px solid rgba(0,229,255,.28);background:rgba(0,229,255,.06);
    font-family:var(--mono);font-size:12px;font-weight:600;color:var(--neon);text-shadow:0 0 7px rgba(0,229,255,.6);
  }
  .num.dot{border-color:var(--line);background:none;color:#4a4a4a;text-shadow:none}
  .go:hover .num{border-color:var(--neon);box-shadow:0 0 10px rgba(0,229,255,.4)}
  .body{flex:1;min-width:0}
  .title{
    font-size:13.5px;line-height:1.25;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .meta{display:flex;align-items:center;gap:8px;margin-top:1px;font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.03em;white-space:nowrap;overflow:hidden}
  .meta .id{color:var(--neon);opacity:.85}
  .tag{display:none;font-style:normal;color:#000;background:var(--grn);border-radius:4px;padding:0 5px;font-weight:700;letter-spacing:.06em;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 4px rgba(0,255,163,.4)}50%{box-shadow:0 0 14px rgba(0,255,163,.95)}}
  .row.next .tag{display:inline-block}
  .row.next .go{background:rgba(0,255,163,.05);box-shadow:inset 2px 0 0 var(--grn)}
  .row.done .title{color:#8d8d8d}
  .row.done .num{opacity:.55}
  .row.flash{animation:flash 1.8s ease-out}
  @keyframes flash{0%,40%{box-shadow:0 0 0 1px var(--grn),0 0 26px rgba(0,255,163,.7);border-radius:8px}100%{box-shadow:none}}
  .extra{
    flex:none;font-family:var(--mono);font-size:9.5px;color:var(--mut);
    border:1px solid var(--line);border-radius:5px;padding:4px 5px;letter-spacing:.04em;
  }
  .extra:hover{color:var(--neon);border-color:var(--neon);box-shadow:0 0 10px rgba(0,229,255,.3)}
  .tick{
    flex:none;position:relative;width:24px;height:24px;margin:0 3px 0 2px;padding:0;border-radius:50%;
    border:1px solid #2c2c2c;background:none;color:transparent;display:grid;place-items:center;
    transition:border-color .12s,box-shadow .12s,background .12s;
  }
  .tick::after{content:"";position:absolute;inset:-7px}
  .tick svg{width:13px;height:13px;stroke-width:2.4}
  .tick:hover{border-color:var(--grn);color:rgba(0,255,163,.55)}
  .row.done .tick{border-color:var(--grn);background:rgba(0,255,163,.12);color:var(--grn);box-shadow:0 0 10px rgba(0,255,163,.45)}

  .empty{border:1px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--mut)}
  .empty button{
    display:block;margin:12px auto 0;background:transparent;border:1px solid var(--neon);color:var(--neon);
    border-radius:8px;padding:7px 14px;font-family:var(--mono);font-size:12px;
  }

  /* ── neeche: chhoti si madad + notes ── */
  .foot{display:flex;flex-wrap:wrap;gap:5px 18px;align-items:center;margin-top:14px;color:var(--mut);font-family:var(--mono);font-size:11px}
  .foot b{color:var(--neon);font-weight:600}
  .foot .o{display:inline-block;width:11px;height:11px;border:1px solid var(--grn);border-radius:50%;vertical-align:-1px;box-shadow:0 0 6px rgba(0,255,163,.5)}
  .save{background:transparent;border:1px solid var(--grn);color:var(--grn);border-radius:7px;padding:5px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;box-shadow:0 0 12px rgba(0,255,163,.3)}
  .save[hidden]{display:none}
  details.srcs{margin-top:8px}
  details.srcs summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--mut);list-style:none;user-select:none;padding:4px 0;display:inline-block}
  details.srcs summary::-webkit-details-marker{display:none}
  details.srcs summary::before{content:"+ ";color:var(--neon)}
  details.srcs[open] summary::before{content:"− "}
  .srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:6px}
  .src{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
  .src h3{margin:0;font-size:13.5px;font-family:var(--mono);color:#fff}
  .src .by{color:var(--mut);font-size:12px;margin:2px 0 8px;font-family:var(--mono)}
  .src .note{font-size:12.5px;line-height:1.5;margin:0 0 8px;background:rgba(255,200,60,.05);border:1px solid rgba(255,200,60,.35);border-radius:8px;padding:8px 10px;color:#ffd98a}
  .src a{color:var(--neon);font-size:12px;font-family:var(--mono);text-decoration:none}
  .src a:hover{text-shadow:0 0 8px rgba(0,229,255,.6)}

  /* ── link patti ── */
  .bar{
    position:fixed;z-index:5;left:0;right:0;bottom:0;background:rgba(5,5,5,.96);
    border-top:1px solid var(--neon);padding:9px 0;
    transform:translateY(110%);transition:transform .18s ease;box-shadow:0 -6px 30px rgba(0,229,255,.35);
  }
  .bar.on{transform:none}
  .bar.wide .msg{flex-basis:100%;white-space:normal}
  .bar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar .msg{flex:1 1 180px;min-width:0;font-size:12px;color:var(--grn);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar input{flex:2 1 240px;min-width:0;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:#000;color:var(--neon);font-family:var(--mono);font-size:11.5px}
  .bar button{border:1px solid var(--neon);background:var(--neon);color:#000;border-radius:7px;padding:8px 14px;font-weight:700;font-family:var(--mono);font-size:12px}
  .bar a#bar-open[hidden]{display:none}
  .bar a#bar-open{border:1px solid var(--neon);color:var(--neon);border-radius:7px;padding:7px 12px;font-family:var(--mono);font-size:12px;text-decoration:none;white-space:nowrap}
  .bar button.ghost{background:transparent;color:var(--mut);border-color:var(--line);font-weight:400}

  @media (min-width:640px){
    .tiles{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}
  }
  @media (min-width:980px){
    .tile{flex-direction:row;gap:8px;padding:10px 8px 11px}
    .tile .lb{font-size:11px}
    .tile .n{position:static;font-size:10.5px}
  }
  @media (max-width:600px){
    header{padding-top:12px}
    .search{max-width:none;flex-basis:60%;margin-left:0;order:3}
    .lucky{order:4}
    .prog{margin-left:auto}
    .filters{margin-left:0}
    .deck{gap:7px;margin-top:7px;padding:6px 7px}
    .deck .meter{display:none}
    .deck .eyebrow{font-size:9px}
    .deck .nextname{font-size:11.5px}
    .deck .continue{padding:5px 7px}
    .go{min-height:44px}
    .info .about{display:none}
    .tile{padding:6px 4px 7px;gap:3px}
    .tile svg{width:18px;height:18px}
    .extra{padding:8px 7px}
    .tick{width:28px;height:28px}
    .kchip,.viewchip{padding:6px 8px}
    .viewchip{margin-left:0}
  }

  /* ── AGENTS LAB: tamam agents, chat mein check ho sakte hain ya nahi ── */
  .tile.lab{color:#ffc857;border-color:rgba(255,200,87,.45);background:rgba(255,200,87,.05)}
  .tile.lab .n{color:#ffc857}
  .tile.lab[aria-pressed="true"]{color:#ffc857;border-color:#ffc857;background:rgba(255,200,87,.09);
    box-shadow:0 0 0 1px rgba(255,200,87,.35),0 0 18px rgba(255,200,87,.3),inset 0 -12px 18px -14px rgba(255,200,87,.9);text-shadow:0 0 8px rgba(255,200,87,.6)}
  .tile.lab[aria-pressed="true"] svg{filter:drop-shadow(0 0 5px rgba(255,200,87,.9))}
  .deck.lab{border-color:rgba(255,200,87,.3);border-left-color:#ffc857;background:linear-gradient(90deg,rgba(255,200,87,.08),transparent 70%);align-items:flex-start}
  .deck.lab .beacon{background:#ffc857;box-shadow:0 0 10px #ffc857;margin-top:5px}
  .deck.lab .eyebrow{color:#ffc857}
  .deck.lab .copy{flex-wrap:wrap;gap:2px 8px}
  .deck.lab .nextname{white-space:normal;overflow:visible}
  .labnote{margin:6px 0 2px;color:#b9b9b9;font-size:12.5px;line-height:1.45}
  .labkey{display:flex;flex-wrap:wrap;gap:4px 12px;margin:4px 0 2px;font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.03em}
  .labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:0 22px;margin-bottom:10px}
  .labgrid .row{align-items:stretch}

<body>
<div class="wrap">

<script>
(async function(){

const LIB = await fetch("./dashboard-data.json?v=" + Date.now(), {cache:"no-store"}).then(r => { if (!r.ok) throw new Error("dashboard-data.json load failed: " + r.status); return r.json(); });
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const size = b => !b ? '' : b >= 1e9 ? (b/1e9).toFixed(1)+'GB' : b >= 1e6 ? Math.round(b/1e6)+'MB' : Math.max(1,Math.round(b/1e3))+'KB';
const KIND = {Video:'▶ VIDEO',PDF:'PDF',Image:'IMAGE',Template:'TEMPLATE',Text:'TEXT','Web page':'PAGE',Doc:'DOC',Preset:'PRESET',File:'FILE'};
const KIND_S = {Video:'VID',PDF:'PDF',Image:'IMG',Template:'TPL',Text:'TXT','Web page':'WEB',Doc:'DOC',Preset:'SET',File:'FILE'};
const GROUPS = [['Video','▶ VIDEO'],['PDF','PDF'],['Image','IMAGE'],['Other','OTHER']];
const group = k => (k === 'Video' || k === 'PDF' || k === 'Image') ? k : 'Other';
const ICON = {
  proj:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
  lab:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/>',
  courses:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M10 8l5 2.5-5 2.5zM8 21h8"/>',
  agents:'<rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 4.5V8M9.5 16h5M2.5 12.5v3M21.5 12.5v3"/><path stroke-width="2.6" d="M9 12.5h.01M15 12.5h.01M12 3.5h.01"/>',
  prompts:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/>',
  economy:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
  invest:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  content:'<path d="M3 10v4h3l7 4V6l-7 4H3zM16.5 9a4 4 0 010 6M19 6.5a8 8 0 010 11"/>',
  accounts:'<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/>',
  book:'<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h11"/>',
  code:'<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',
  folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  movies:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7.5 5v14M16.5 5v14M3 9.5h4.5M3 14.5h4.5M16.5 9.5H21M16.5 14.5H21"/>',
  tools:'<path d="M14.7 6.3a4 4 0 00-5.3 5.3L3.5 17.5l3 3 5.9-5.9a4 4 0 005.3-5.3l-2.7 2.7-2.4-.6-.6-2.4z"/>',
  all:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};
const svg = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n] || ICON.folder}</svg>`;
const catBy = Object.fromEntries(LIB.categories.map(c => [c.name, c]));
const shortOf = Object.fromEntries(LIB.categories.map(c => [c.name, c.short || c.name.toUpperCase()]));
const itemBy = Object.fromEntries(LIB.items.map(i => [i.id, i]));
const state = { cat: LIB.categories[0].name, q:'', kind:'All', view:'All', labKind:'All', labTested:false };
/* AGENTS LAB: LIB.agents = tamam agents; chat = yes | half | no (isi chat mein chala kar check ho sakta hai ya nahi) */
const LAB = '@lab';
const AGENTS = LIB.agents || [];
const isLab = () => state.cat === LAB;
const LAB_SECS = [['yes','Isi chat mein check ho sakte hain'],['half','Adha: aap ka account ya key chahiye'],['no','Is chat mein nahi chal sakte']];
const LAB_KIND = {agent:'AGENT', pack:'AGENTS PACK', skill:'SKILL', mcp:'MCP', flow:'MAKE AUTOMATION', tool:'TOOL', list:'LIST'};
const LAB_ORDER = ['agent','pack','skill','mcp','flow','tool','list'];
/* PROJECTS: LIB.projects = jo software aur kaam bane. group = chat (is chat mein) | old (pehle ke, Ai School Drive folder se) */
const PROJ = '@proj';
const PROJECTS = LIB.projects || [];
const isProj = () => state.cat === PROJ;
const PROJ_GROUPS = [['chat','Is chat mein bane'],['old','Pehle ke projects (Ai School Drive folder se)']];
const PROJ_NOTE = {old:'Yeh is chat mein nahi bane. Maloomat 13 Nov ki jaanch aur aaj parhi hui files se hai. Naam dabane se Drive ka link copy hota hai.'};
const P_STATUS = {live:'CHAL RAHA HAI', done:'MUKAMMAL', building:'BAN RAHA HAI', code:'CODE MAUJOOD', copy:'DOOSRE KA PROJECT', notbuilt:'NAHI BANA'};
const P_KIND = {app:'APP', tool:'TOOL', report:'REPORT', bot:'BOT', copy:'COPY'};
const projHay = p => [p.id, p.name, p.what, p.stage, P_STATUS[p.status], P_KIND[p.kind], (p.tech||[]).join(' '), (p.done||[]).join(' '), (p.todo||[]).join(' '),
  ['sources','data','outputs'].map(g => (p[g]||[]).map(f => (f.path||f.name)+' '+f.about).join(' ')).join(' ')].join(' ').toLowerCase();
const folded = new Set();           /* band kiye hue hisse */
let shownItems = [], shownKey = i => i.category;
/* NEW: sirf tab jab library mein ek se zyada tareekh ka maal ho; sab se nayi tareekh wale items */
const addedDates = [...new Set(LIB.items.map(i => i.added).filter(Boolean))].sort();
const newDate = addedDates.length > 1 ? addedDates[addedDates.length - 1] : null;
const isNew = i => !!newDate && i.added === newDate;
const kindOk = i => state.kind === 'All' || (state.kind === 'New' ? isNew(i) : group(i.kind) === state.kind);
const foldKey = k => (state.q ? 'q' : state.cat) + '|' + k;
/* cover / preview files ko learning path ka pehla qadam nahi banate; woh list mein phir bhi maujood hain */
const supportItem = i => /(?:preview image|cover image|page image \(untitled\)|screenshot \(untitled\))/i.test(i.title);
const unseenFirst = items => items.find(i => !done.has(i.id) && !supportItem(i)) || items.find(i => !done.has(i.id)) || null;
const inView = items => state.view === 'Todo' ? items.filter(i => !done.has(i.id)) : state.view === 'Done' ? items.filter(i => done.has(i.id)) : items;

/* ── "dekh liya" nishan. Browser mein yaad rehte hain; chat ke preview mein yaad nahi rehte, is liye PROGRESS SAVE button hai ── */
const KEY = 'techno-library-done-v1';
let store = null;
try { store = window.localStorage; store.getItem(KEY); } catch(e){ store = null; }
const baked = new Set((LIB.done || []).filter(id => itemBy[id]));
let saved = {done:[], undone:[]};
try { if (store){ const s = JSON.parse(store.getItem(KEY)); if (s && Array.isArray(s.done) && Array.isArray(s.undone)) saved = s; } } catch(e){}
const done = new Set([...baked, ...saved.done].filter(id => itemBy[id] && !saved.undone.includes(id)));
function persist(){
  if (!store) return;
  try { store.setItem(KEY, JSON.stringify({done:[...done].filter(x => !baked.has(x)), undone:[...baked].filter(x => !done.has(x))})); } catch(e){}
}
const changed = () => done.size !== baked.size || [...done].some(x => !baked.has(x));

/* title ke shuru ka number ("3. ..." ya "Lesson 3 - ...") alag kar ke badge mein dikhate hain */
function split(t){
  const m = /^Lesson\s+(\d+)\s*[-–—:]\s*(.+)$/i.exec(t) || /^(\d{1,2})\.\s*(.+)$/.exec(t);
  return m ? {n:m[1], t:m[2]} : {n:'', t};
}
const words = () => state.q.toLowerCase().split(/\s+/).filter(Boolean);
/* search ke lafz title mein roshan karta hai */
function hl(t){
  const q = words();
  if (!q.length) return esc(t);
  const re = new RegExp('(' + q.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'ig');
  return String(t).split(re).map((part, k) => k % 2 ? '<mark>' + esc(part) + '</mark>' : esc(part)).join('');
}
function scope(){
  const q = words();
  return LIB.items.filter(i => q.length
    ? q.every(w => (i.id+' '+i.title+' '+shortOf[i.category]+' '+i.section).toLowerCase().includes(w))
    : state.cat === 'All' || i.category === state.cat);
}
const oneShelf = () => !state.q && state.cat !== 'All';

function renderTiles(){
  const inCat = c => LIB.items.filter(i => i.category === c);
  const on = c => !state.q && state.cat === c;
  const tile = (key, label, icon, items, k) => {
    const d = items.filter(i => done.has(i.id)).length;
    const full = items.length > 0 && d === items.length;
    return `<button type="button" class="tile${full ? ' full' : ''}" data-cat="${esc(key)}" aria-pressed="${on(key)}" title="${esc(label)} · ${items.length} items${full ? ' · poori dekh li' : d ? ' · '+d+' dekh liye' : ''}${k <= 9 ? ' · key '+k : ''}">` +
      `${svg(icon)}<span class="lb">${esc(key === 'All' ? 'ALL' : shortOf[key])}</span><span class="n">${full ? '✓' : items.length}</span>${items.some(isNew) ? '<span class="dotnew"></span>' : ''}` +
      `<span class="pb" style="width:${items.length ? Math.round(d/items.length*100) : 0}%"></span></button>`;
  };
  $('tiles').className = 'tiles' + (state.q ? ' dim' : '');
  const ran = AGENTS.filter(a => a.tested).length;
  const labTile = !AGENTS.length ? '' :
    `<button type="button" class="tile lab" data-cat="${LAB}" aria-pressed="${on(LAB)}" title="Agents Lab · ${AGENTS.length} agents · ${ran} chala kar dekhe · key 1">` +
    `${svg('lab')}<span class="lb"><i class="lg">AGENTS </i>LAB</span><span class="n">${AGENTS.length}</span></button>`;
  const projTile = !PROJECTS.length ? '' :
    `<button type="button" class="tile proj" data-cat="${PROJ}" aria-pressed="${on(PROJ)}" title="Projects · ${PROJECTS.length} · jo software aur kaam bane · key ${labTile ? 2 : 1}">` +
    `${svg('proj')}<span class="lb">PROJECTS</span><span class="n">${PROJECTS.length}</span></button>`;
  const off = (labTile ? 1 : 0) + (projTile ? 1 : 0);
  $('tiles').innerHTML = labTile + projTile + LIB.categories.map((c, k) => tile(c.name, c.name, c.icon || 'folder', inCat(c.name), k+1+off)).join('') +
    tile('All', 'Poori library', 'all', LIB.items, LIB.categories.length+1+off);
}

function renderInfo(sc){
  const shown = inView(sc);
  const total = sc.reduce((s, i) => s + i.files.reduce((a, f) => a + (f.size || 0), 0), 0);
  const d = sc.filter(i => done.has(i.id)).length;
  const stat = `${sc.length} ITEMS${total ? ' · ' + size(total) : ''}${d ? ' · ✓ ' + d : ''}`;
  let head;
  if (state.q) head = `<h2>“${esc(state.q)}”</h2><span class="about">poori library mein dhoonda</span>`;
  else if (state.cat === 'All') head = `<h2>Poori library</h2><span class="about">sab shelves, tarteeb se</span>`;
  else head = `<h2>${esc(state.cat)}</h2><span class="about">${esc(catBy[state.cat].about || '')}</span>`;
  const counts = {}; shown.forEach(i => { const g = group(i.kind); counts[g] = (counts[g] || 0) + 1; });
  const present = GROUPS.filter(g => counts[g[0]]);
  const fresh = shown.filter(isNew).length;
  const chip = (k, label) => `<button type="button" class="kchip" data-kind="${k}" aria-pressed="${state.kind === k}">${label}</button>`;
  const chips = present.length < 2 && !fresh ? '' :
    chip('All', 'SAB') + (fresh ? chip('New', 'NAYA ' + fresh) : '') +
    (present.length < 2 ? '' : present.map(g => chip(g[0], g[1] + ' ' + counts[g[0]])).join(''));
  /* SIRF BAQI ka button tab hi aata hai jab kuch dekh liya ho aur kuch baqi ho */
  const todo = d && d < sc.length
    ? `<button type="button" class="viewchip" data-view="${state.view === 'Todo' ? 'All' : 'Todo'}" aria-pressed="${state.view === 'Todo'}" title="Sirf woh dikhao jo abhi nahi dekha">SIRF BAQI ${sc.length - d}</button>` : '';
  $('info').innerHTML = head + `<span class="stat">${stat}</span>` +
    (chips || todo ? `<div class="filters" role="group" aria-label="Filter">${chips}${todo}</div>` : '');
}

function renderDeck(){
  if (isLab()){ renderLabDeck(); return; }
  if (isProj()){ renderProjDeck(); return; }
  const own = scope();
  if (state.q && !own.length){
    $('deck').className = 'deck complete';
    $('deck').innerHTML = `<span class="beacon" aria-hidden="true"></span><div class="copy"><span class="eyebrow">SEARCH</span><span class="nextname">Is naam ya number ka koi result nahi. Search saaf kar ke phir dekhein.</span></div>`;
    return;
  }
  const pick = unseenFirst(own);
  /* poori library ka agla: shelves ki tarteeb se (COURSES pehle), shelf number se nahi */
  const overall = unseenFirst(LIB.categories.flatMap(c => LIB.items.filter(i => i.category === c.name)));
  const outside = !pick && overall && oneShelf();
  const item = pick || overall;
  const left = LIB.items.length - done.size;
  if (!item){
    $('deck').className = 'deck complete';
    $('deck').innerHTML = `<span class="beacon" aria-hidden="true"></span><div class="copy"><span class="eyebrow">MISSION COMPLETE</span><span class="nextname">Zabardast — ${LIB.items.length} mein se sab dekh liya.</span></div><span class="meter">✓ ${LIB.items.length}/${LIB.items.length}</span>`;
    return;
  }
  const where = outside ? ` · agli shelf: ${shortOf[item.category]}` : !oneShelf() ? ` · ${shortOf[item.category]}` : '';
  $('deck').className = 'deck' + (outside ? ' complete' : '');
  $('deck').innerHTML = `<span class="beacon" aria-hidden="true"></span><div class="copy"><span class="eyebrow">${outside ? 'IS SHELF KA KAAM HO GAYA' : 'UP NEXT'}</span><span class="nextname"><b>${item.id}</b> · ${esc(item.title)}${esc(where)}</span></div><span class="meter">${left} baqi</span><a class="continue" data-mark="${item.id}" href="${esc(item.files[0].url)}" target="_blank" rel="noopener noreferrer" data-title="${item.id} · ${esc(item.title)}">KHOLEN ↗</a>`;
}

  const m = i.files[0], s = split(i.title), t = i.id + ' · ' + esc(i.title);
  return `<div class="row${done.has(i.id) ? ' done' : ''}${supportItem(i) ? ' support' : ''}" data-id="${i.id}" style="--i:${Math.min(n, 30)}">
    <a class="go" href="${esc(m.url)}" target="_blank" rel="noopener noreferrer" data-title="${t}" title="${esc(i.title)}">
      <span class="num${s.n ? '' : ' dot'}">${s.n || '•'}</span>
      <span class="body"><span class="title">${hl(s.t)}</span>
      <span class="meta"><i class="tag"></i>${isNew(i) ? '<span class="new">NEW</span>' : ''}<span class="id">${hl(i.id)}</span><span>${KIND[m.kind] || 'FILE'}${m.kind === 'Video' && m.size ? ' · ' + size(m.size) : ''}</span></span></span></a>
    ${i.files.slice(1).map(f => `<a class="extra" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer" data-title="${t} (${esc(f.kind)})" title="${esc(f.kind)} bhi hai${f.size ? ' · ' + size(f.size) : ''}">+${KIND_S[f.kind] || 'FILE'}</a>`).join('')}
    <button type="button" class="tick" aria-pressed="${done.has(i.id)}" aria-label="Dekh liya: ${esc(i.title)}" title="Dekh liya (dobara dabane se hat jata hai)">${svg('check')}</button>
  </div>`;
}

function renderLabDeck(){
  const ran = AGENTS.filter(a => a.tested).length;
  $('deck').className = 'deck lab';
  $('deck').innerHTML = `<span class="beacon" aria-hidden="true"></span><div class="copy"><span class="eyebrow">CHAT KA COMPUTER</span><span class="nextname">${esc((LIB.lab || {}).env || '')}</span></div><span class="meter">✓ ${ran}/${AGENTS.length} chala kar dekhe</span>`;
}
function labRow(a, n){
  const t = a.id + ' · ' + esc(a.name);
  const from = (a.from || []).map(f => `<span>${hl(f)}</span>`).join('');
  return `<div class="row arow s-${a.chat}" data-aid="${a.id}" style="--i:${Math.min(n, 30)}">
    <a class="ago" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" data-title="${t}" title="Dabane se link copy hota hai">
      <span class="num">${a.id.slice(2)}</span>
      <span class="body"><span class="title">${hl(a.name)}</span>
      <span class="meta"><span class="id">${hl(a.id)}</span><span class="bdg">${LAB_KIND[a.kind] || 'AGENT'}</span>` +
      (a.tested ? '<span class="bdg ok">✓ CHALA KAR DEKHA</span>' : a.chat === 'no' ? '' : '<span class="bdg todo">ABHI NAHI CHALAYA</span>') +
      (a.sure === false ? '<span class="bdg guess">REPO PAKKA NAHI</span>' : '') + from + `</span>
      <span class="what">${hl(a.what)}</span>` +
      (a.result ? `<span class="res">${esc(a.result)}</span>` : '') +
      (a.why ? `<span class="why">${esc(a.why)}</span>` : '') + `</span></a>
  </div>`;
}
function renderLab(animate){
  const q = words();
  const base = AGENTS.filter(a => !q.length || q.every(w => (a.id+' '+a.name+' '+a.what+' '+(LAB_KIND[a.kind]||'')+' '+(a.from||[]).join(' ')).toLowerCase().includes(w)));
  const kinds = LAB_ORDER.filter(k => base.some(a => a.kind === k));
  if (state.labKind !== 'All' && !kinds.includes(state.labKind)) state.labKind = 'All';
  const ranN = base.filter(a => a.tested).length;
  if (state.labTested && !ranN) state.labTested = false;
  const items = base.filter(a => (state.labKind === 'All' || a.kind === state.labKind) && (!state.labTested || a.tested));
  const chip = (k, label) => `<button type="button" class="kchip" data-labkind="${k}" aria-pressed="${state.labKind === k}">${label}</button>`;
  const head = q.length ? `<h2>“${esc(state.q)}”</h2><span class="about">Agents Lab mein dhoonda</span>` : `<h2>Agents Lab</h2><span class="about">tamam agents, aur kaun isi chat mein check ho sakta hai</span>`;
  $('info').innerHTML = head + `<span class="stat">${base.length} AGENTS · ✓ ${ranN} CHALAYE</span>` +
    `<div class="filters" role="group" aria-label="Filter">${chip('All', 'SAB')}${kinds.length > 1 ? kinds.map(k => chip(k, LAB_KIND[k] + ' ' + base.filter(a => a.kind === k).length)).join('') : ''}` +
    (ranN ? `<button type="button" class="viewchip" data-labtested="1" aria-pressed="${state.labTested}" title="Sirf woh dikhao jo chala kar dekhe gaye">SIRF CHALAYE HUE ${ranN}</button>` : '') + `</div>`;
  renderTiles(); renderLabDeck(); shownItems = [];
  $('pn').textContent = '✓ ' + done.size + '/' + LIB.items.length;
  $('pb').style.width = (done.size / LIB.items.length * 100) + '%';
  $('save').hidden = !!store || !changed();
  if (!items.length){
    $('list').innerHTML = `<div class="empty">Agents Lab mein kuch nahi mila. Library mein dhoondne ke liye pehle koi shelf chunein.<button type="button" id="reset">Wapas</button></div>`;
    return;
  }
  let html = '', n = 0, step = 0;
  for (const [key, label] of LAB_SECS){
    const its = items.filter(a => a.chat === key)
      .sort((x, y) => (y.tested - x.tested) || (LAB_ORDER.indexOf(x.kind) - LAB_ORDER.indexOf(y.kind)));
    if (!its.length) continue;
    step++;
    const fk = 'lab|' + key, ran = its.filter(a => a.tested).length;
    html += `<button type="button" class="sec s-${key}" data-fold="${fk}" aria-expanded="${!folded.has(fk)}" title="Dabane se yeh hissa band ya khulta hai">` +
      `<span class="nm"><span class="st">${String(step).padStart(2, '0')}</span>${esc(label)}</span><span class="ln"></span><span class="ct">${ran ? '✓ ' + ran + '/' + its.length : its.length}</span><span class="chev" aria-hidden="true"></span></button>`;
    if (folded.has(fk)) continue;
    html += `<div class="labgrid">` + its.map(a => labRow(a, n++)).join('') + `</div>`;
  }
  const eg = AGENTS.find(a => a.chat === 'yes' && !a.tested) || AGENTS.find(a => a.chat !== 'no' && !a.tested) || AGENTS[0];
  const note = q.length ? '' : `<p class="labnote">${esc((LIB.lab || {}).about || '')} Kisi ko chalwana ho to chat mein us ka number likhein, jaise <b>“${eg.id} chala kar dikhao”</b>.</p>` +
    `<div class="labkey"><span><span class="bdg ok">✓ CHALA KAR DEKHA</span> isi chat mein chal chuka</span><span><span class="bdg todo">ABHI NAHI CHALAYA</span> chal sakta hai, abhi try nahi hua</span><span><span class="bdg guess">REPO PAKKA NAHI</span> naam se dhoonda, andaza</span></div>`;
  $('list').innerHTML = note + `<div class="lab-list${animate ? ' anim' : ''}">${html}</div>`;
}

function renderProjDeck(){
  const n = k => PROJECTS.filter(p => p.group === k).length;
  $('deck').className = 'deck proj';
  $('deck').innerHTML = `<span class="beacon" aria-hidden="true"></span><div class="copy"><span class="eyebrow">KAAM KI MEZ</span><span class="nextname">${n('chat')} cheezein is chat mein banin, ${n('old')} pehle ki hain. Har aik ke sath: kya ban chuka, kya baqi hai, aur source files.</span></div>`;
}
function fileRow(p, grp, k, f){
  const meta = [f.lines ? f.lines + ' lines' : '', f.bytes ? size(f.bytes) : ''].filter(Boolean).join(' · ');
  const tag = f.missing ? 'FILE NAHI MILI' : f.code != null ? 'CODE DEKHEIN' : f.url ? 'LINK COPY' : 'PATH COPY';
  return `<button type="button" class="frow${f.missing ? ' miss' : ''}" data-file="${p.id}|${grp}|${k}" title="${f.code != null ? 'Dabane se code yahin khulta hai' : f.url ? 'Dabane se link copy hota hai' : 'Dabane se file ka path copy hota hai'}">` +
    `<span class="fp">${hl(f.path || f.name)}${meta ? `<small>${meta}</small>` : ''}</span><span class="fa">${hl(f.about || '')}</span><span class="fb${f.code != null ? ' code' : ''}">${tag}</span></button>`;
}
function projCard(p){
  const list = (cls, title, arr) => !arr || !arr.length ? '' :
    `<details class="pblock ${cls}" open><summary><b>${title}</b> ${arr.length}</summary><ul>${arr.map(x => `<li>${hl(x)}</li>`).join('')}</ul></details>`;
  const files = (title, grp) => !(p[grp] || []).length ? '' :
    `<details class="pblock src pfiles" open><summary><b>${title}</b> ${p[grp].length}</summary>${p[grp].map((f, k) => fileRow(p, grp, k, f)).join('')}</details>`;
  const run = !(p.run || []).length ? '' :
    `<details class="pblock pfiles" open><summary><b>Chalane ka tareeqa</b></summary>${p.run.map(r => `<div class="pcmd"><button type="button" data-cmd="${esc(r.cmd)}" title="Dabane se copy hota hai">${esc(r.cmd)}</button><span>${esc(r.about || '')}</span></div>`).join('')}</details>`;
  return `<article class="pcard st-${p.status}" data-pid="${p.id}">
    <div class="phead"><span class="num">${p.id.slice(2)}</span><div class="body"><h3>${hl(p.name)}</h3>
      <div class="meta"><span class="id">${hl(p.id)}</span><span class="pst ${p.status}">${P_STATUS[p.status] || ''}</span><span class="bdg">${P_KIND[p.kind] || 'APP'}</span>` +
      (p.version ? `<span>${esc(p.version)}</span>` : '') + (p.licence ? `<span>${esc(p.licence)}</span>` : '') + `</div></div></div>
    <p class="pwhat">${hl(p.what)}</p>` + (p.stage ? `<p class="pstage">${hl(p.stage)}</p>` : '') +
    ((p.tech || []).length ? `<div class="ptech">${p.tech.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : '') +
    `<div class="pgrid">${list('ok', 'Ban chuka', p.done)}${list('todo', 'Baqi hai / dhyan', p.todo)}${list('', 'Kya check hua, kya nahi', p.tests)}</div>` +
    files('Source files', 'sources') + files('Data', 'data') + files('Tayyar files', 'outputs') + run +
    (p.next ? `<p class="pnext"><b>AGLA QADAM</b>${hl(p.next)}</p>` : '') + `</article>`;
}
function renderProj(animate){
  const q = words();
  const items = PROJECTS.filter(p => !q.length || q.every(w => projHay(p).includes(w)));
  const nCode = PROJECTS.reduce((s, p) => s + ['sources','data','outputs'].reduce((a, g) => a + (p[g] || []).filter(f => f.code != null).length, 0), 0);
  const head = q.length ? `<h2>“${esc(state.q)}”</h2><span class="about">Projects mein dhoonda</span>` : `<h2>Projects</h2><span class="about">jo software aur kaam hum bana rahe the ya bana chuke</span>`;
  $('info').innerHTML = head + `<span class="stat">${items.length} PROJECTS · ${nCode} FILES KA CODE YAHIN</span>`;
  renderTiles(); renderProjDeck(); shownItems = [];
  $('pn').textContent = '✓ ' + done.size + '/' + LIB.items.length;
  $('pb').style.width = (done.size / LIB.items.length * 100) + '%';
  $('save').hidden = !!store || !changed();
  if (!items.length){
    $('list').innerHTML = `<div class="empty">Projects mein kuch nahi mila. Library mein dhoondne ke liye pehle koi shelf chunein.<button type="button" id="reset">Wapas</button></div>`;
    return;
  }
  let html = q.length ? '' : `<p class="labnote">Jis file par <b>CODE DEKHEIN</b> likha hai, use dabane se us ka poora code yahin khul jata hai. Kisi project par kaam karwana ho to chat mein us ka number likhein, jaise <b>“P-01 ka agla hissa banao”</b>.</p>`;
  html += `<div class="pindex">${items.map(p => `<button type="button" class="pix" data-jump="${p.id}" title="Dabane se neeche is project par le jata hai"><span class="pid">${p.id}</span><span class="pnm">${hl(p.name)}</span><span class="pst ${p.status}">${P_STATUS[p.status] || ''}</span></button>`).join('')}</div>`;
  for (const [key, label] of PROJ_GROUPS){
    const ps = items.filter(p => p.group === key);
    if (!ps.length) continue;
    html += `<div class="pgroup"><span>${esc(label)}</span><span class="ln"></span><span class="ct">${ps.length}</span></div>` +
      (PROJ_NOTE[key] && !q.length ? `<p class="pnote">${esc(PROJ_NOTE[key])}</p>` : '') + ps.map(projCard).join('');
  }
  $('list').innerHTML = `<div class="proj-list${animate ? ' anim' : ''}">${html}</div>`;
}

async function copyLong(t){
  try { if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); return true; } } catch(e){}
  try { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok; } catch(e){ return false; }
}

function renderList(animate){
  if (isLab()){ renderLab(animate); return; }
  if (isProj()){ renderProj(animate); return; }
  const sc = scope();
  const dn = sc.filter(i => done.has(i.id)).length;
  if (state.view !== 'All' && (!dn || dn === sc.length)) state.view = 'All';
  const viewed = inView(sc);
  if (state.kind !== 'All' && !viewed.some(kindOk)) state.kind = 'All';
  renderInfo(sc);
  const items = viewed.filter(kindOk);
  renderDeck();
  if (!items.length){
    const msg = state.view === 'Done' ? 'Is shelf mein abhi koi dekh li hui cheez nahi.' : 'Kuch nahi mila. Spelling ya filter badal kar dekhein.';
    $('list').innerHTML = `<div class="empty">${msg}<button type="button" id="reset">Wapas</button></div>`;
    shownItems = [];
    return;
  }
  const one = oneShelf();
  const key = i => one ? i.source + '|' + i.section : i.category;
  const ordered = one ? items : LIB.categories.flatMap(c => items.filter(i => i.category === c.name));
  /* ek shelf: us ke hisse STEP 01, 02… ke saath; andar wale hisse (↳) ko number nahi milta */
  const secs = [...new Set(items.map(key))], steps = {};
  if (one){ let n = 0; secs.forEach(k => { steps[k] = secs.some(o => o !== k && k.startsWith(o + ' › ')) ? 0 : ++n; }); }
  const label = i => one ? i.section.split(' › ').pop().replace(/^\d+\)\s*/, '') : shortOf[i.category];
  shownItems = ordered; shownKey = key;
  const heads = secs.length > 1 || !!state.q;
  let html = '', last = null, n = 0;
  for (const i of ordered){
    const k = key(i), fk = foldKey(k);
    if (k !== last && heads){
      const sub = one && !steps[k];
      const name = !one ? esc(label(i)) : sub ? '↳ ' + esc(label(i)) : `<span class="st">${String(steps[k]).padStart(2, '0')}</span>${esc(label(i))}`;
      html += `<button type="button" class="sec${sub ? ' sub' : ''}" data-fold="${esc(fk)}" aria-expanded="${!folded.has(fk)}" title="Dabane se yeh hissa band ya khulta hai">` +
        `<span class="nm">${name}</span><span class="ln"></span><span class="ct" data-ct="${esc(k)}"></span><span class="chev" aria-hidden="true"></span></button>`;
    }
    last = k;
    if (heads && folded.has(fk)) continue;
    html += row(i, n++);
  }
  $('list').innerHTML = `<div class="cols${animate ? ' anim' : ''}">${html}</div>`;
  marks();
}
/* nishan, AGLA tag aur progress ko dobara list banaye baghair taza karta hai */
function marks(){
  const rows = [...document.querySelectorAll('#list .row')];
  rows.forEach(r => {
    const d = done.has(r.dataset.id);
    r.classList.toggle('done', d); r.classList.remove('next');
    r.querySelector('.tick').setAttribute('aria-pressed', d);
  });
  const cand = unseenFirst(shownItems);
  const next = cand && rows.find(r => r.dataset.id === cand.id);
  if (next && oneShelf() && state.kind === 'All'){
    next.classList.add('next');
    next.querySelector('.tag').textContent = scope().some(i => done.has(i.id)) ? 'AGLA' : 'SHURU';
  }
  document.querySelectorAll('#list .ct').forEach(el => {
    const its = shownItems.filter(i => shownKey(i) === el.dataset.ct), d = its.filter(i => done.has(i.id)).length;
    el.textContent = d === its.length ? '✓ ' + its.length : d + '/' + its.length;
    el.classList.toggle('full', d === its.length);
  });
  $('pn').textContent = '✓ ' + done.size + '/' + LIB.items.length;
  $('pb').style.width = (done.size / LIB.items.length * 100) + '%';
  $('save').hidden = !!store || !changed();
  renderTiles();
  renderDeck();
}
function setDone(id, v){
  if (v) done.add(id); else done.delete(id);
  persist();
  if (state.view !== 'All') { renderList(false); return; }
  marks();
  renderInfo(scope());
}

function renderSources(){
  $('sources').innerHTML = LIB.sources.map(s =>
    `<div class="src"><h3>${esc(s.title)}</h3><p class="by">${esc(s.by)} · ${s.items} items${s.size ? ' · ' + size(s.size) : ''}</p>` +
    (s.note ? `<p class="note">${esc(s.note)}</p>` : '') +
    (s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" data-title="${esc(s.title)} — poora folder">POORA FOLDER ↗</a>` : '') + `</div>`).join('');
}

const SHELF_KEY = 'techno-library-shelf-v1';
function go(cat){
  state.cat = cat; state.q = ''; state.kind = 'All'; state.view = 'All'; state.labKind = 'All'; state.labTested = false; $('q').value = '';
  try { if (store) store.setItem(SHELF_KEY, cat); } catch(e){}
  renderList(true);
}

/* har click par link neeche patti mein aata hai aur copy ho jata hai, taake tab na khule to bhi link mil jaye */
async function copyText(t){
  try { if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); return true; } } catch(e){}
  try { const el = $('bar-url'); el.focus(); el.select(); return document.execCommand('copy'); } catch(e){ return false; }
}
/* pehle naya tab kholne ki koshish; chat ke andar (sandbox) yeh band hota hai, tab link copy ho kar patti mein aata hai */
let blockedOnce = false;
/* SANDBOXED = chat ka file preview: wahan browser naya tab kholne hi nahi deta, page kuch nahi kar sakta.
   Is liye wahan TAB button chhupa dete hain aur saaf bata dete hain. Download kar ke browser mein kholne par sab khulta hai. */
const SANDBOXED = window.origin === 'null' && location.protocol !== 'file:';
if (SANDBOXED){
  $('bar-open').hidden = true;
  $('hint').innerHTML = 'Is preview mein naya tab nahi khulta: naam dabane se link <b>copy</b> hota hai. Seedha kholne ke liye <b>Library_Links.md</b> kholein.';
}
function openTab(url, title){
  let w = null;
  try { w = window.open(url, '_blank'); if (w) w.opener = null; } catch(e){ w = null; }
  if (w){ showBar(title, url, 'Naye tab mein khul gaya · ', 'Naye tab mein khul gaya · '); return; }
  const msg = blockedOnce ? 'Link copy ho gaya · '
    : SANDBOXED ? 'Chat ke preview mein naya tab nahi khul sakta. Link copy ho gaya, browser mein paste karein. Seedha kholne ke liye Library_Links.md kholein · '
    : 'Browser ne tab rok diya (popup block). Link copy ho gaya, naye tab mein paste karein · ';
  showBar(title, url, msg, 'Link yeh hai · ', !blockedOnce);
  blockedOnce = true;
}
async function showBar(title, text, okMsg, failMsg, wide){
  $('bar').classList.toggle('wide', !!wide);   /* lamba paigham poori line mein, kata hua nahi */
  $('bar-url').value = text; $('bar-open').href = text;
  $('bar').classList.add('on');
  const ok = await copyText(text);
  $('bar-title').textContent = (ok ? (okMsg || 'Link copy ho gaya · ') : (failMsg || 'Link yeh hai · ')) + title;
}
function lucky(){
  const pool = LIB.items.filter(i => !done.has(i.id));
  const list = pool.length ? pool : LIB.items;
  const pick = list[Math.floor(Math.random() * list.length)];
  [...folded].filter(k => k.startsWith(pick.category + '|')).forEach(k => folded.delete(k));
  go(pick.category);
  const r = document.querySelector(`#list .row[data-id="${pick.id}"]`);
  if (r){ r.scrollIntoView({block:'center'}); r.classList.add('flash'); setTimeout(() => r.classList.remove('flash'), 1900); }
  showBar(pick.id + ' · ' + pick.title, pick.files[0].url, 'Aaj yeh dekhein · ', 'Aaj yeh dekhein · ');
}

document.addEventListener('click', e => {
  const a = e.target.closest('a[href]');
  if (a){
    if (a.id === 'bar-open'){ e.preventDefault(); openTab(a.href, $('bar-title').textContent.replace(/^[^·]*· /, '')); return; }
    e.preventDefault();
    openTab(a.href, a.dataset.title || a.textContent.trim());
    if (a.classList.contains('go')) setDone(a.closest('.row').dataset.id, true);
    if (a.dataset.mark) setDone(a.dataset.mark, true);
    return;
  }
  const tick = e.target.closest('.tick');
  if (tick){ const id = tick.closest('.row').dataset.id; setDone(id, !done.has(id)); return; }
  const fold = e.target.closest('[data-fold]');
  if (fold){ const k = fold.dataset.fold; if (folded.has(k)) folded.delete(k); else folded.add(k); renderList(false); return; }
  if (e.target.id === 'top'){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  const tile = e.target.closest('[data-cat]');
  if (tile){ go(tile.dataset.cat); return; }
  if (e.target.id === 'v-close' || e.target.id === 'viewer'){ closeViewer(); return; }
  if (e.target.id === 'v-copy'){ copyLong(viewerText).then(ok => { $('v-copy').textContent = ok ? 'COPY HO GAYA' : 'COPY NAHI HUA'; }); return; }
  const fr = e.target.closest('[data-file]');
  if (fr){
    const [pid, grp, k] = fr.dataset.file.split('|');
    const p = PROJECTS.find(x => x.id === pid), f = p && (p[grp] || [])[+k];
    if (!f) return;
    if (f.code != null) openViewer(p, f);
    else if (f.url) openTab(f.url, pid + ' · ' + f.name);
    else showBar(pid + ' · ' + f.path, f.path, 'Path copy ho gaya. Chat mein likhein: “yeh file dikhao” · ', 'File ka path yeh hai · ');
    return;
  }
  const jp = e.target.closest('[data-jump]');
  if (jp){ const c = document.querySelector(`.pcard[data-pid="${jp.dataset.jump}"]`); if (c){ c.scrollIntoView({block:'start', behavior:'smooth'}); c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1700); } return; }
  const cm = e.target.closest('[data-cmd]');
  if (cm){ showBar('command', cm.dataset.cmd, 'Command copy ho gaya · ', 'Command yeh hai · '); return; }
  const lk = e.target.closest('[data-labkind]');
  if (lk){ state.labKind = lk.dataset.labkind; renderList(true); return; }
  if (e.target.closest('[data-labtested]')){ state.labTested = !state.labTested; renderList(true); return; }
  const chip = e.target.closest('[data-kind]');
  if (chip){ state.kind = chip.dataset.kind; renderList(true); return; }
  const view = e.target.closest('[data-view]');
  if (view){ state.view = view.dataset.view; renderList(true); return; }
  if (e.target.closest('#lucky')){ lucky(); return; }
  if (e.target.id === 'reset'){ go(state.cat); $('q').focus(); return; }
  if (e.target.id === 'save'){
    const ids = LIB.items.map(i => i.id).filter(id => done.has(id));
    showBar('', 'Library done: ' + (ids.join(', ') || 'kuch nahi'), 'Copy ho gaya. Yeh line chat mein paste karein, progress pakki save ho jayegi.', 'Yeh line copy kar ke chat mein paste karein.');
  }
});
$('q').addEventListener('input', e => {
  state.q = e.target.value.trim(); state.kind = 'All'; state.view = 'All';
  [...folded].filter(k => k.startsWith('q|')).forEach(k => folded.delete(k));
  renderList(false);
});
window.addEventListener('scroll', () => { $('top').hidden = window.scrollY < 500; }, {passive:true});
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ const f = document.querySelector('#list .go'); if (f){ e.preventDefault(); f.focus(); } }
});
$('bar-copy').addEventListener('click', async () => {
  const ok = await copyText($('bar-url').value);
  $('bar-title').textContent = ok ? 'Copy ho gaya' : 'Copy nahi hua, select kar ke copy karein';
});
$('bar-close').addEventListener('click', () => $('bar').classList.remove('on'));
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === 'Escape'){ if (!$('viewer').hidden){ closeViewer(); return; } $('bar').classList.remove('on'); }
  if (!$('viewer').hidden) return;
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/'){ e.preventDefault(); $('q').focus(); return; }
  if (/^[1-9]$/.test(e.key)){
    const t = document.querySelectorAll('#tiles .tile')[+e.key - 1];
    if (t) go(t.dataset.cat);
  }
});
try { const last = store && store.getItem(SHELF_KEY); if (last === 'All' || catBy[last] || (last === LAB && AGENTS.length) || (last === PROJ && PROJECTS.length)) state.cat = last; } catch(e){}
/* LIB.open: 'projects' ya 'lab' ho to dashboard usi par khulta hai */
if (LIB.open === 'projects' && PROJECTS.length) state.cat = PROJ;
else if (LIB.open === 'lab' && AGENTS.length) state.cat = LAB;
renderSources(); renderList(true);

})().catch(err => { console.error("Dashboard load error", err); const box = document.getElementById("list"); if (box) box.innerHTML = "<div class=\"empty\">Dashboard data load nahi hua. dashboard-data.json check karein.</div>"; });
</script>
